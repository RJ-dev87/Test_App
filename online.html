<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Online Auswahl</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
      background-color: #e3f2fd;
    }
    h2 {
      margin-bottom: 40px;
    }
    select {
      width: 300px;
      padding: 10px;
      margin: 20px;
      font-size: 16px;
    }
    #output {
      margin-top: 40px;
      font-size: 24px;
      padding: 20px;
      border: 2px solid #333;
      border-radius: 10px;
      width: 80%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <h2>Online-Auswahl</h2>

  <div>
    <label for="plattform">Plattform:</label><br>
    <select id="plattform" onchange="updateNumber()">
      <option value="">Bitte wählen</option>
      <option value="Tinder/Hinge">Tinder/Hinge</option>
      <option value="Feeld">Feeld</option>
    </select>
  </div>

  <div>
    <label for="stil">Stil:</label><br>
    <select id="stil" onchange="updateNumber()">
      <option value="">Bitte wählen</option>
      <option value="Dreist">Dreist</option>
      <option value="Witzig">Witzig</option>
      <option value="Seriös">Seriös</option>
      <option value="Universell">Universell</option>
    </select>
  </div>

  <div id="output">Bitte wähle beide Optionen aus.</div>

  <script>
    const kombiMap = {
      "Tinder/Hinge|Dreist": "Ehrliches Feedback: dein Profil ist fast perfekt.",
      "Tinder/Hinge|Witzig": "Humorvoller Opener für Tinder/Hinge.",
      "Tinder/Hinge|Seriös": "Seriöser Start für Tinder/Hinge.",
      "Tinder/Hinge|Universell": "Mal ehrlich: wieviele Typen sprechen dich auf [irgendwas] in deinem dritten Bild an?",
      "Feeld|Dreist": "Challenge: Wir gründen eine Mini-Sekte. Was ist das erste, was wir anzünden? & Ich hab Tarotkarten befragt, was bei unserem Match rauskommt. Sie sagen: 😈 + 🍷 + 🔮. Könnte schlimmer sein.",
      "Feeld|Witzig": "Vermutung: Du siehst aus, als ob du guten Wein, Trash-TV und originelle Safewords kombinierst. Stimmt’s? & Plakative Frage: Wenn unser Match ein Getränk wäre, wäre es mehr Espresso oder mehr Matcha?",
      "Feeld|Seriös": "Hi, ich war hier eine Weile nicht aktiv, aber dein Profil finde ich wirklich ansprechend. Ich würde dich gern kennenlernen, um zu sehen ob die Chemie zwischen uns stimmt.",
      "Feeld|Universell": "Erster Eindruck: Du wirkst als würdest du deine Grenzen kennen...und sie trotzdem gern austesten."
    };

    function updateNumber() {
      const plattform = document.getElementById("plattform").value;
      const stil = document.getElementById("stil").value;
      const key = `${plattform}|${stil}`;
      const output = document.getElementById("output");

      if (kombiMap[key]) {
        output.textContent = kombiMap[key];
      } else {
        output.textContent = "Bitte wähle beide Optionen aus.";
      }
    }

    // Standardwert setzen beim Laden: Tinder/Hinge | Universell
    window.onload = function() {
      document.getElementById("plattform").value = "Tinder/Hinge";
      document.getElementById("stil").value = "Universell";
      updateNumber();
    };
  </script>
</body>
</html>
