<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline Auswahl</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
      background-color: #fff8e1;
    }
    h2 {
      margin-bottom: 40px;
    }
    select {
      width: 300px;
      padding: 10px;
      margin: 20px;
      font-size: 16px;
    }
    #output {
      margin-top: 40px;
      font-size: 20px;
      padding: 20px;
      border: 2px solid #333;
      border-radius: 10px;
      width: 80%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <h2>Offline-Auswahl</h2>

  <div>
    <label for="location">1) Location:</label><br>
    <select id="location" onchange="updateNumber()">
      <option value="">Bitte wählen</option>
      <option selected>Straße</option>
      <option>Bus/Bahn</option>
      <option>Geschäft/Supermarkt</option>
      <option>Park</option>
      <option>Club</option>
      <option>Bar</option>
      <option>Event</option>
      <option>Arbeit</option>
    </select>
  </div>

  <div>
    <label for="tageszeit">2) Tageszeit:</label><br>
    <select id="tageszeit" onchange="updateNumber()">
      <option value="">Bitte wählen</option>
      <option selected>tagsüber</option>
      <option>nachts</option>
    </select>
  </div>

  <div>
    <label for="ihr-kontext">3) Ihr Kontext:</label><br>
    <select id="ihr-kontext" onchange="updateNumber()">
      <option value="">Bitte wählen</option>
      <option selected>allein</option>
      <option>zu zweit</option>
      <option>in der Gruppe</option>
    </select>
  </div>

  <div>
    <label for="dein-kontext">4) Dein Kontext:</label><br>
    <select id="dein-kontext" onchange="updateNumber()">
      <option value="">Bitte wählen</option>
      <option selected>allein</option>
      <option>mit Wingman</option>
    </select>
  </div>

  <div id="output">Bitte wähle alle Optionen aus.</div>

  <script>
    const kombinationMap = {
      "Straße|tagsüber|allein|allein": { nummer: 1, text: "Hi, ich bin gerade auf dem Weg einen neuen [Rucksack] zu kaufen, wie taugt dir deiner?" },
      "Straße|tagsüber|allein|mit Wingman": { nummer: 2, text: "" },
      "Straße|tagsüber|zu zweit|allein": { nummer: 3, text: "" },
      "Straße|tagsüber|zu zweit|mit Wingman": { nummer: 4, text: "" },
      "Straße|tagsüber|in der Gruppe|allein": { nummer: 5, text: "" },
      "Straße|tagsüber|in der Gruppe|mit Wingman": { nummer: 6, text: "" },
      "Straße|nachts|allein|allein": { nummer: 7, text: "Nicht ansprechen.]" },
      "Straße|nachts|allein|mit Wingman": { nummer: 8, text: "[Nicht ansprechen.]" },
      ...
      "Arbeit|nachts|in der Gruppe|mit Wingman": { nummer: 96, text: "" }
    };

    function updateNumber() {
      const loc = document.getElementById("location").value;
      const time = document.getElementById("tageszeit").value;
      const ihr = document.getElementById("ihr-kontext").value;
      const du = document.getElementById("dein-kontext").value;
      const key = `${loc}|${time}|${ihr}|${du}`;
      const output = document.getElementById("output");

      if (kombinationMap[key]) {
        output.innerHTML = `<strong>Kombinationsnummer:</strong> ${kombinationMap[key].nummer}<br><em>${kombinationMap[key].text}</em>`;
      } else {
        output.textContent = "Bitte wähle alle Optionen aus.";
      }
    }

    // Default setzen beim Laden
    window.onload = updateNumber;
  </script>
</body>
</html>
